<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EMS — граф контрактов</title><link rel="stylesheet" href="/web/design.css"><link rel="stylesheet" href="/web/studio.css"><link rel="stylesheet" href="/web/mobile.css"><link rel="stylesheet" href="/web/flow.css"><link rel="manifest" href="/web/manifest.webmanifest"><body>
<header class="app-header"><a class="brand" href="/web/projects.html">EMS</a><input id="project-name" aria-label="Название проекта"><button id="save">Сохранить</button><details class="file-actions"><summary>Файл</summary><div><button id="compile">Скачать приложение</button><button id="flowchart-export">Блок-схема SVG</button><button id="export">Экспорт проекта</button><button id="source">Код сборки EMS</button></div></details></header>
<div class="toolbar"><strong>Граф контрактов</strong><div class="pane-toggles"><button id="toggle-library">Контракты</button><button id="toggle-inspector">Свойства</button><button id="toggle-result">Результат</button></div><button id="run">▶ Запустить</button><button id="stop" disabled>Остановить</button></div>
<main><aside><details class="library-section" open><summary>Контракты</summary><input id="catalog-search" placeholder="Найти контракт" aria-label="Поиск контрактов"><label class="field-label">Тип элемента массива<input id="catalog-element-type" list="flow-types" value="Number" aria-label="Тип элемента массива"></label><div id="catalog"></div></details><details><summary>Параметры программы</summary><form id="add-input"><input id="input-name" placeholder="limit" required><input id="input-type" list="flow-types" value="Number" aria-label="Тип входа программы"><button>Добавить вход</button></form></details></aside>
<section class="workspace"><div class="scope-bar"><span id="scope">Программа</span><div class="canvas-tools"><div class="history-actions"><button id="undo" aria-label="Отменить">↶</button><button id="redo" aria-label="Повторить">↷</button></div><button id="fit-graph">Весь граф</button><button id="zoom-out">−</button><button id="zoom-in">+</button></div></div><div id="viewport"><div id="world"><svg id="wires"></svg><div id="nodes"></div></div></div></section>
<aside class="inspector"><h2>Данные запуска</h2><div id="run-inputs"></div><h2>Свойства</h2><div id="inspector"></div></aside></main>
<section class="execution"><p id="output">Перетащите контракты и соедините их порты.</p><details><summary>Пройденные контракты</summary><pre id="trace"></pre></details><p id="connection-status" role="status"></p><p id="error" role="alert"></p></section>
<dialog id="source-dialog"><form method="dialog"><button>Закрыть</button></form><p>Код сборки из этого графа. Изменяйте программу её контрактами.</p><textarea id="generated-source" readonly></textarea></dialog>
<datalist id="flow-types"></datalist><script type="module" src="/web/flow.mjs"></script><script type="module" src="/web/mobile.mjs"></script><script type="module" src="/web/pwa.mjs"></script></body></html>
