# Managed by EMS language deployment
server {
    listen 80;
    listen [::]:80;
    server_name dev-ems.d-mash.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/ems-language-dev-acme; default_type text/plain; }
    location / { return 301 https://dev-ems.d-mash.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name dev-ems.d-mash.ru;
    ssl_certificate /etc/letsencrypt/live/ems-language-dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ems-language-dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic off;
    access_log /var/log/nginx/ems-language-dev.access.log;
    error_log /var/log/nginx/ems-language-dev.error.log;
    add_header Strict-Transport-Security "max-age=300" always;
    location / {
        proxy_pass http://127.0.0.1:18877;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }
}
